# The Electron product jobs of the CI workflow started from the github-ops skill's assets/ci-routing/ci.yml;
# how they join it: the electron-scaffold skill, electron-testing.md section 6.
jobs:
  # Fast checks: feedback in seconds; if they fail there is no need to wait for e2e
  checks:
    name: typecheck + unit tests
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      # every action at a full commit with its release in a comment (the github-ops skill: pin every action)
      - uses: actions/checkout@<40-hex commit> # v<x.y.z>
      - uses: pnpm/action-setup@<40-hex commit> # v<x.y.z>
      - uses: actions/setup-node@<40-hex commit> # v<x.y.z>
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # [append the project's own extra checks here, such as consistency scripts or lint]

  # e2e drives a real Electron. It runs on ubuntu rather than macos: macOS runners bill private repositories at 10×,
  # and e2e asserts the full IPC chain, contract validation and DOM geometry, none of which depends on the platform.
  # The macOS-only surface (signing, notarisation, TCC permissions) is outside e2e anyway, guarded by local verification and the release flow.
  e2e:
    name: e2e(Electron)
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      # every action at a full commit with its release in a comment (the github-ops skill: pin every action)
      - uses: actions/checkout@<40-hex commit> # v<x.y.z>
      - uses: pnpm/action-setup@<40-hex commit> # v<x.y.z>
      - uses: actions/setup-node@<40-hex commit> # v<x.y.z>
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Electron and Chromium share the same system libraries; let playwright install them instead of hand-writing apt package names
      # (package names drift with the ubuntu version, e.g. libasound2 → libasound2t64)
      - run: pnpm exec playwright install-deps chromium
      # Electron needs a display server; -a picks a free display number automatically
      - run: xvfb-run -a pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@<40-hex commit> # v<x.y.z>
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

# smoke does not run in CI: scripts/smoke.sh is local to macOS (BSD stat, macOS process paths),
# and its value lies in the developer machine's real data shape; in a CI container it is a degraded e2e.
# Migration scenarios are covered by e2e with its isolated userData and seeded fixtures.
